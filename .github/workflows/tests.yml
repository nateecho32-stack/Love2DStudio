name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  suite:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install LÖVE 11.5
        shell: pwsh
        run: |
          $url = "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile love.zip
          Expand-Archive -Path love.zip -DestinationPath .
          Rename-Item love-11.5-win64 love

      - name: Run the test suite
        shell: pwsh
        run: |
          $env:FRAMEWORK_SANDBOX = "1"
          & .\love\lovec.exe $PWD.FullName --test
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Visual shots
        shell: pwsh
        run: |
          & .\love\lovec.exe $PWD.FullName --shot demo
          & .\love\lovec.exe $PWD.FullName --shot editor
          & .\love\lovec.exe $PWD.FullName --shot gh_game

      - name: Upload shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: |
            shot_*.png
          if-no-files-found: ignore
